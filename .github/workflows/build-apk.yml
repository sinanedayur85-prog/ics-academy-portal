              public static String sanitizeTargetHref(String raw) {
                  if (raw == null) return "";
                  String clean = raw.trim();
                  if (clean.length() < 2 || clean.length() > 240) return "";
                  if (!clean.startsWith("#")) return "";
                  if (!clean.matches("^#[a-zA-Z0-9_?=&%-]{1,239}$")) return "";
                  return clean;
              }

              private void storePendingNotificationHref(String safeHref) {
                  long nowMs = System.currentTimeMillis();
                  pendingNotificationHref = safeHref;
                  pendingNotificationTsMs = nowMs;
                  try {
                      android.content.SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      prefs.edit()
                          .putString("pendingNotificationHref", safeHref)
                          .putLong("pendingNotificationTsMs", nowMs)
                          .apply();
                  } catch (Exception ignored) {
                  }
              }

              private void clearPendingNotificationHref() {
                  pendingNotificationHref = "";
                  pendingNotificationTsMs = 0L;
                  try {
                      android.content.SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      prefs.edit()
                          .remove("pendingNotificationHref")
                          .remove("pendingNotificationTsMs")
                          .apply();
                  } catch (Exception ignored) {
                  }
              }

              private String readPendingNotificationHref(boolean consume) {
                  String href = pendingNotificationHref;
                  long ts = pendingNotificationTsMs;
                  if (href == null || href.isEmpty()) {
                      try {
                          android.content.SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          href = prefs.getString("pendingNotificationHref", "");
                          ts = prefs.getLong("pendingNotificationTsMs", 0L);
                      } catch (Exception ignored) {
                          href = "";
                          ts = 0L;
                      }
                  }
                  String safe = sanitizeTargetHref(href);
                  if (safe.isEmpty() || (ts > 0L && (System.currentTimeMillis() - ts) > PENDING_HREF_TTL_MS)) {
                      clearPendingNotificationHref();
                      return "";
                  }
                  if (consume) {
                      clearPendingNotificationHref();
                  }
                  return safe;
              }

              private void dispatchNotificationHrefToWebView(final WebView webView, final String safeHref) {
                  if (webView == null || safeHref == null || safeHref.isEmpty()) return;
                  final String escaped = safeHref
                      .replace("\\\\", "\\\\\\\\")
                      .replace("'", "\\\\'")
                      .replace("\\n", "");
                  final String js = "try{window.dispatchEvent(new CustomEvent('ics-notification-open',{detail:{href:'" + escaped + "'}}));}catch(e){}";
                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              private void captureNotificationIntent(Intent intent, boolean dispatchImmediately) {
                  if (intent == null) return;
                  try {
                      String rawHref = intent.getStringExtra(EXTRA_TARGET_HREF);
                      if (rawHref == null || rawHref.trim().isEmpty()) {
                          rawHref = intent.getStringExtra("href");
                      }
                      String safeHref = sanitizeTargetHref(rawHref);
                      if (safeHref.isEmpty()) return;

                      int callNotifyId = intent.getIntExtra(IncomingCallActivity.EXTRA_NOTIFY_ID, 0);
                      String callIdExtra = intent.getStringExtra(IncomingCallActivity.EXTRA_CALL_ID);
                      if (callNotifyId != 0 || (callIdExtra != null && !callIdExtra.isEmpty())) {
                          try {
                              NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null && callNotifyId != 0) {
                                  nm.cancel(callNotifyId);
                              }
                              Intent cancelBroadcast = new Intent(IncomingCallActivity.ACTION_CALL_CANCELLED);
                              cancelBroadcast.setPackage(getPackageName());
                              if (callIdExtra != null) {
                                  cancelBroadcast.putExtra(IncomingCallActivity.EXTRA_CALL_ID, callIdExtra);
                              }
                              sendBroadcast(cancelBroadcast);
                          } catch (Exception ignored) {
                          }
                      }

                      intent.removeExtra(EXTRA_TARGET_HREF);
                      intent.removeExtra("href");
                      intent.removeExtra(IncomingCallActivity.EXTRA_NOTIFY_ID);
                      intent.removeExtra(IncomingCallActivity.EXTRA_CALL_ID);
                      storePendingNotificationHref(safeHref);

                      if (dispatchImmediately && this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView webView = this.bridge.getWebView();
                          dispatchNotificationHrefToWebView(webView, safeHref);
                          webView.postDelayed(() -> {
                              String stillPending = readPendingNotificationHref(false);
                              if (!stillPending.isEmpty()) {
                                  dispatchNotificationHrefToWebView(webView, stillPending);
                              }
                          }, 350);
                      }
                  } catch (Exception ignored) {
                  }
              }

