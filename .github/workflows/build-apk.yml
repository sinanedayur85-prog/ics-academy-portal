              private static String sanitizeClassTopic(String rawClass) {
                  if (rawClass == null) return "";
                  String norm = rawClass.replaceFirst("(?i)^class\\\\s+", "").replaceAll("\\\\s+", " ").trim().toUpperCase(Locale.ROOT);
                  if (norm.isEmpty() || "ALL".equals(norm)) return "";
                  String slug = norm.replaceAll("[^A-Z0-9]+", "_").replaceAll("^_+|_+$", "");
                  return slug.isEmpty() ? "" : ("ics_class_" + slug);
              }

              public static void syncTopicsForIdentity(final Context context) {
                  if (context == null) return;
                  final Context appCtx = context.getApplicationContext();
                  try {
                      SharedPreferences prefs = appCtx.getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      String actorId = prefs.getString("actorId", "");
                      if (actorId == null || actorId.trim().isEmpty()) return;

                      String role = prefs.getString("role", "student");
                      String className = prefs.getString("className", "");
                      String assignedJson = prefs.getString("assignedClassesJson", "[]");

                      Set<String> desired = new HashSet<String>();
                      desired.add("ics_all");

                      String actorTopic = sanitizeActorTopic(actorId);
                      if (!actorTopic.isEmpty()) desired.add(actorTopic);

                      boolean isPrincipal = "principal".equalsIgnoreCase(role);
                      boolean isStaff = isPrincipal || "usthad".equalsIgnoreCase(role);
                      if (isStaff) desired.add("ics_staff");
                      if (isPrincipal) desired.add("ics_principal");

                      String myClassTopic = sanitizeClassTopic(className);
                      if (!myClassTopic.isEmpty()) desired.add(myClassTopic);

                      try {
                          JSONArray arr = new JSONArray(assignedJson);
                          for (int i = 0; i < arr.length(); i++) {
                              String ct = sanitizeClassTopic(arr.optString(i, ""));
                              if (!ct.isEmpty()) desired.add(ct);
                          }
                      } catch (Exception ignored) {
                      }

                      Set<String> previous = new HashSet<String>(prefs.getStringSet("subscribedTopics", new HashSet<String>()));
                      FirebaseMessaging fm = FirebaseMessaging.getInstance();

                      for (String oldTopic : previous) {
                          if (!desired.contains(oldTopic)) {
                              fm.unsubscribeFromTopic(oldTopic);
                          }
                      }
                      for (String topic : desired) {
                          fm.subscribeToTopic(topic);
                      }

                      prefs.edit().putStringSet("subscribedTopics", desired).apply();
                  } catch (Exception ignored) {
                  }
              }

              public static void syncCurrentTokenToServer(final Context context) {
                  if (context == null) return;
                  final Context appCtx = context.getApplicationContext();
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                          if (!task.isSuccessful()) return;
                          String token = task.getResult();
                          if (token == null || token.trim().isEmpty()) return;
                          SharedPreferences prefs = appCtx.getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          prefs.edit().putString("fcmToken", token.trim()).apply();
                          syncTopicsForIdentity(appCtx);
                          registerTokenToServerAsync(appCtx, token.trim());
                      });
                  } catch (Exception ignored) {
                  }
              }

              public static void registerTokenToServerAsync(final Context context, final String token) {
                  if (context == null || token == null || token.trim().isEmpty()) return;
                  final Context appCtx = context.getApplicationContext();
                  new Thread(() -> {
                      try {
                          SharedPreferences prefs = appCtx.getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          String actorId = prefs.getString("actorId", "");
                          if (actorId == null || actorId.trim().isEmpty()) return;

                          String actorName = prefs.getString("actorName", "");
                          String role = prefs.getString("role", "student");
                          String className = prefs.getString("className", "");
                          String assignedJson = prefs.getString("assignedClassesJson", "[]");

                          JSONObject body = new JSONObject();
                          body.put("token", token.trim());
                          body.put("actorId", actorId.trim());
                          body.put("actorRole", role != null ? role.trim() : "student");
                          body.put("actorName", actorName != null ? actorName.trim() : "");
                          body.put("className", className != null ? className.trim() : "");
                          try {
                              body.put("assignedClasses", new JSONArray(assignedJson));
                          } catch (Exception ignored) {
                              body.put("assignedClasses", new JSONArray());
                          }
                          body.put("platform", "android-apk");

                          byte[] payloadBytes = body.toString().getBytes(StandardCharsets.UTF_8);

                          for (String base : API_BASES) {
                              HttpURLConnection conn = null;
                              try {
                                  URL url = new URL(base + "/api/push/fcm/register");
                                  conn = (HttpURLConnection) url.openConnection();
                                  conn.setRequestMethod("POST");
                                  conn.setConnectTimeout(6000);
                                  conn.setReadTimeout(6000);
                                  conn.setDoOutput(true);
                                  conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                                  try (OutputStream os = conn.getOutputStream()) {
                                      os.write(payloadBytes);
                                      os.flush();
                                  }
                                  int code = conn.getResponseCode();
                                  if (code >= 200 && code < 300) {
                                      break;
                                  }
                              } catch (Exception ignored) {
                              } finally {
                                  if (conn != null) conn.disconnect();
                              }
                          }
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              public static void markCallDeclinedSync(final String callId) {
                  if (callId == null) return;
                  final String cleanCallId = callId.trim();
                  if (!cleanCallId.matches("^[a-zA-Z0-9_-]{4,96}$")) return;
                  if (FIRESTORE_PROJECT_ID.isEmpty() || FIRESTORE_DB_ID.isEmpty() || FIRESTORE_API_KEY.isEmpty()) return;

                  final String docName = "projects/" + FIRESTORE_PROJECT_ID
                      + "/databases/" + FIRESTORE_DB_ID
                      + "/documents/campusCalls/" + cleanCallId;
                  final String commitUrl = "https://firestore.googleapis.com/v1/projects/" + FIRESTORE_PROJECT_ID
                      + "/databases/" + FIRESTORE_DB_ID
                      + "/documents:commit?key=" + FIRESTORE_API_KEY;

                  HttpURLConnection conn = null;
                  try {
                      long nowMs = System.currentTimeMillis();
                      JSONObject fields = new JSONObject();
                      fields.put("status", new JSONObject().put("stringValue", "declined"));
                      fields.put("endedAtMs", new JSONObject().put("integerValue", String.valueOf(nowMs)));
                      fields.put("durationSec", new JSONObject().put("integerValue", "0"));
                      fields.put("updatedAtMs", new JSONObject().put("integerValue", String.valueOf(nowMs)));

                      JSONObject updateDoc = new JSONObject();
                      updateDoc.put("name", docName);
                      updateDoc.put("fields", fields);

                      JSONArray fieldPaths = new JSONArray();
                      fieldPaths.put("status");
                      fieldPaths.put("endedAtMs");
                      fieldPaths.put("durationSec");
                      fieldPaths.put("updatedAtMs");

                      JSONObject write = new JSONObject();
                      write.put("update", updateDoc);
                      write.put("updateMask", new JSONObject().put("fieldPaths", fieldPaths));
                      write.put("currentDocument", new JSONObject().put("exists", true));

                      JSONObject root = new JSONObject();
                      root.put("writes", new JSONArray().put(write));

                      byte[] payloadBytes = root.toString().getBytes(StandardCharsets.UTF_8);
                      URL url = new URL(commitUrl);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setConnectTimeout(4500);
                      conn.setReadTimeout(4500);
                      conn.setDoOutput(true);
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(payloadBytes);
                          os.flush();
                      }
                      conn.getResponseCode();
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

