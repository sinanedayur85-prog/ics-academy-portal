                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle(headerTitle)
                          .setContentText(preview)
                          .setStyle(inbox)
                          .setNumber(count)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                      manager.notify(BG_NOTIFICATION_ID, builder.build());
                  } catch (Exception ignored) {
                  }
              }
          }
          `;
          fs.writeFileSync(bgServicePath, bgServiceJava, 'utf8');

          const bootReceiverPath = path.join(mainActivityDir, 'CampusBootReceiver.java');
          const bootReceiverJava = `package com.icsacademy.manhappatta;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class CampusBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent != null && Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      CampusBackgroundNotificationService.schedulePeriodic(context);
                  }
              }
          }
          `;
          fs.writeFileSync(bootReceiverPath, bootReceiverJava, 'utf8');

          // 5. Write Native Firebase Cloud Messaging (FCM) Service for 1-second instant closed-app Android push notifications
          const fcmServicePath = path.join(mainActivityDir, 'CampusFirebaseMessagingService.java');
          const fcmServiceJava = `package com.icsacademy.manhappatta;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessaging;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;

          public class CampusFirebaseMessagingService extends FirebaseMessagingService {
              private static final String CHANNEL_ID = "ics_academy_updates";
              private static final String[] API_BASES = new String[] {
                  "https://ais-pre-rhfqjrwneaewkmnanoof2j-896319436298.asia-east1.run.app",
                  "https://ais-dev-rhfqjrwneaewkmnanoof2j-896319436298.asia-east1.run.app"
              };

              public static void syncCurrentTokenToServer(final Context context) {
                  if (context == null) return;
                  final Context appCtx = context.getApplicationContext();
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                          if (!task.isSuccessful()) return;
                          String token = task.getResult();
                          if (token == null || token.trim().isEmpty()) return;
                          SharedPreferences prefs = appCtx.getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          prefs.edit().putString("fcmToken", token.trim()).apply();
                          registerTokenToServerAsync(appCtx, token.trim());
                      });
                  } catch (Exception ignored) {
                  }
              }

              public static void registerTokenToServerAsync(final Context context, final String token) {
                  if (context == null || token == null || token.trim().isEmpty()) return;
                  final Context appCtx = context.getApplicationContext();
                  new Thread(() -> {
                      try {
                          SharedPreferences prefs = appCtx.getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          String actorId = prefs.getString("actorId", "");
                          if (actorId == null || actorId.trim().isEmpty()) return;

                          String actorName = prefs.getString("actorName", "");
                          String role = prefs.getString("role", "student");
                          String className = prefs.getString("className", "");
                          String assignedJson = prefs.getString("assignedClassesJson", "[]");

                          JSONObject body = new JSONObject();
                          body.put("token", token.trim());
                          body.put("actorId", actorId.trim());
                          body.put("actorRole", role != null ? role.trim() : "student");
                          body.put("actorName", actorName != null ? actorName.trim() : "");
                          body.put("className", className != null ? className.trim() : "");
                          try {
                              body.put("assignedClasses", new JSONArray(assignedJson));
                          } catch (Exception ignored) {
                              body.put("assignedClasses", new JSONArray());
                          }
                          body.put("platform", "android-apk");

                          byte[] payloadBytes = body.toString().getBytes(StandardCharsets.UTF_8);

                          for (String base : API_BASES) {
                              HttpURLConnection conn = null;
                              try {
                                  URL url = new URL(base + "/api/push/fcm/register");
                                  conn = (HttpURLConnection) url.openConnection();
                                  conn.setRequestMethod("POST");
                                  conn.setConnectTimeout(6000);
                                  conn.setReadTimeout(6000);
                                  conn.setDoOutput(true);
                                  conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                                  try (OutputStream os = conn.getOutputStream()) {
                                      os.write(payloadBytes);
                                      os.flush();
                                  }
                                  int code = conn.getResponseCode();
                                  if (code >= 200 && code < 300) {
                                      break;
                                  }
                              } catch (Exception ignored) {
                              } finally {
                                  if (conn != null) conn.disconnect();
                              }
                          }
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              @Override
              public void onNewToken(@NonNull String token) {
                  super.onNewToken(token);
                  try {
                      SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      prefs.edit().putString("fcmToken", token.trim()).apply();
                      registerTokenToServerAsync(this, token.trim());
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  try {
                      Map<String, String> data = remoteMessage.getData();
                      String title = data.get("title");
                      String body = data.get("body");
                      String notifId = data.get("notificationId");

                      if ((title == null || title.trim().isEmpty()) && remoteMessage.getNotification() != null) {
                          title = remoteMessage.getNotification().getTitle();
                      }
                      if ((body == null || body.trim().isEmpty()) && remoteMessage.getNotification() != null) {
                          body = remoteMessage.getNotification().getBody();
                      }
                      if (title == null || title.trim().isEmpty()) {
                          title = "ICS Academy";
                      }
                      if (body == null) {
                          body = "";
                      }

                      if (notifId != null && !notifId.trim().isEmpty()) {
                          SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                          Set<String> seen = new HashSet<String>(prefs.getStringSet("seenNotifIds", new HashSet<String>()));
                          seen.add(notifId.trim());
                          prefs.edit().putStringSet("seenNotifIds", seen).apply();
                      }

                      // When app is already open in foreground, CampusNotificationBar handles live alerts & chat-room suppression
                      if (MainActivity.isActivityInForeground()) {
                          return;
                      }

                      NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "ICS Academy Announcements & Attendance",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.enableVibration(true);
                          manager.createNotificationChannel(channel);
                      }

                      Intent intent = new Intent(this, MainActivity.class);
                      intent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, intent, flags);

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle(title.trim())
                          .setContentText(body.trim())
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body.trim()))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                      int notifyId = (notifId != null && !notifId.isEmpty())
                          ? Math.abs(notifId.hashCode())
                          : (int) (System.currentTimeMillis() & 0x7fffffff);
                      manager.notify(notifyId, builder.build());
                  } catch (Exception ignored) {
                  }
              }
          }
          `;
          fs.writeFileSync(fcmServicePath, fcmServiceJava, 'utf8');

          console.log('Successfully configured Android MainActivity, FCM Messaging Service, Background Notification Service, styles.xml, and persistent signing key');
          EOF
          node configure-android.cjs
          rm configure-android.cjs

      - name: Accept Android SDK Licenses & Build Debug APK
        working-directory: ./android
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_DIR}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_DIR}/licenses/android-sdk-preview-license"
          yes | "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Building Debug APK (attempt ${attempt}/3)..."
            if ./gradlew assembleDebug --no-daemon \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000; then
              echo "APK build succeeded on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "APK build failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Rename APK for easy download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ICS-Academy-Manhappatta.apk

