name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ICS-Academy-Manhappatta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android packages
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for easy download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ICS-Academy-Manhappatta.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICS-Academy-Manhappatta-APK
          path: ICS-Academy-Manhappatta.apk
          if-no-files-found: error
          retention-days: 30
