              private void startRingAndVibrate() {
                  stopRingAndVibrate();
                  try {
                      Uri ringtoneUri = RingtoneManager.getActualDefaultRingtoneUri(this, RingtoneManager.TYPE_RINGTONE);
                      if (ringtoneUri == null) {
                          ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      }
                      if (ringtoneUri != null) {
                          ringtone = RingtoneManager.getRingtone(getApplicationContext(), ringtoneUri);
                          if (ringtone != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                                  ringtone.setAudioAttributes(
                                      new AudioAttributes.Builder()
                                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                          .build()
                                  );
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  ringtone.setLooping(true);
                              }
                              ringtone.play();
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  try {
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vibrator != null && vibrator.hasVibrator()) {
                          long[] pattern = new long[]{0L, 650L, 450L, 650L, 1200L};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                          } else {
                              vibrator.vibrate(pattern, 0);
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void stopRingAndVibrate() {
                  try {
                      if (ringtone != null && ringtone.isPlaying()) {
                          ringtone.stop();
                      }
                      ringtone = null;
                  } catch (Exception ignored) {
                  }
                  try {
                      if (vibrator != null) {
                          vibrator.cancel();
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void cancelCallNotification() {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null && notifyId != 0) {
                          nm.cancel(notifyId);
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void handleAcceptCall() {
                  stopRingAndVibrate();
                  cancelCallNotification();

                  String href = "#campus-chat";
                  try {
                      StringBuilder sb = new StringBuilder("#campus-chat?");
                      boolean hasParam = false;
                      if (!roomId.isEmpty()) {
                          sb.append("room=").append(URLEncoder.encode(roomId, "UTF-8"));
                          hasParam = true;
                      }
                      if (!callId.isEmpty()) {
