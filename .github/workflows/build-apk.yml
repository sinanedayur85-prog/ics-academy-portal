                          hasParam = true;
                      }
                      if (hasParam) sb.append("&");
                      sb.append("callAction=accept");
                      href = sb.toString();
                  } catch (Exception ignored) {
                  }

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                          if (km != null && km.isKeyguardLocked()) {
                              km.requestDismissKeyguard(this, null);
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  Intent mainIntent = new Intent(this, MainActivity.class);
                  mainIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  mainIntent.putExtra(MainActivity.EXTRA_TARGET_HREF, href);
                  mainIntent.putExtra(EXTRA_CALL_ID, callId);
                  mainIntent.putExtra(EXTRA_NOTIFY_ID, notifyId);
                  startActivity(mainIntent);
                  finish();
              }

