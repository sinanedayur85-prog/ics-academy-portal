                                  else if ("exam".equals(nType) || "marks".equals(nType)) safeHref = "#academic-hub";
                                  else safeHref = "#notices";
                              }
                              latestTargetHref = safeHref;
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  if (seenChanged) {
                      // Cap stored seen IDs to last 150
                      if (seen.size() > 150) {
                          ArrayList<String> trimmed = new ArrayList<>(seen);
                          seen = new HashSet<>(trimmed.subList(trimmed.size() - 120, trimmed.size()));
                      }
                      prefs.edit().putStringSet("seenNotifIds", seen).apply();
                  }

                  if (!newTitles.isEmpty()) {
                      postNativeBackgroundNotification(newTitles, newMessages, latestTargetHref);
                  }
