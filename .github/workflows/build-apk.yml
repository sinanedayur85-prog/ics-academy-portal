          if gh release view latest-apk --repo "${REPO_NAME}" >/dev/null 2>&1; then
            gh release edit latest-apk \
              --repo "${REPO_NAME}" \
              --title "ICS-Academy-Manhappatta Android APK (v1.0.${RUN_NUMBER})" \
              --notes "${NOTES}" \
              --latest
            gh release upload latest-apk ICS-Academy-Manhappatta.apk public/version.json \
              --repo "${REPO_NAME}" \
              --clobber
          else
            gh release create latest-apk ICS-Academy-Manhappatta.apk public/version.json \
              --repo "${REPO_NAME}" \
              --title "ICS-Academy-Manhappatta Android APK (v1.0.${RUN_NUMBER})" \
              --notes "${NOTES}" \
              --latest
          fi

          {
            echo "### ✅ ICS Academy Android APK Built Successfully (v1.0.${RUN_NUMBER} • Build #${RUN_NUMBER})"
            echo ""
            echo "- **Direct APK Download:** [Download ICS-Academy-Manhappatta.apk](https://github.com/${REPO_NAME}/releases/download/latest-apk/ICS-Academy-Manhappatta.apk)"
            echo "- **Release Page:** [View Latest Release](https://github.com/${REPO_NAME}/releases/tag/latest-apk)"
          } >> "$GITHUB_STEP_SUMMARY"

