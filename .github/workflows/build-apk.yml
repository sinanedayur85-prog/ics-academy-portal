              private boolean isTargeted(
                  JSONObject n,
                  String myActorId,
                  String myActorName,
                  boolean isStaff,
                  boolean isPrincipal,
                  String normMyClass,
                  ArrayList<String> normAssigned
              ) {
                  String senderId = n.optString("actorId", "");
                  String senderName = n.optString("actorName", "");
                  if (!senderId.isEmpty() && senderId.equals(myActorId)) return false;
                  if (senderId.isEmpty() && !senderName.isEmpty() && !myActorName.isEmpty()
                      && senderName.trim().equalsIgnoreCase(myActorName.trim())) return false;

                  String targetRecipientId = n.optString("targetRecipientId", "");
                  if (!targetRecipientId.isEmpty()) return targetRecipientId.equals(myActorId);

                  if (n.optBoolean("targetStaffOnly", false)) return isStaff;

                  String type = n.optString("type", "notice");
                  String normTargetClass = normalizeClass(n.optString("targetClass", ""));
                  ArrayList<String> normTargetClasses = new ArrayList<>();
                  JSONArray tcArr = n.optJSONArray("targetClasses");
                  if (tcArr != null) {
                      for (int i = 0; i < tcArr.length(); i++) {
                          String c = normalizeClass(tcArr.optString(i, ""));
                          if (!c.isEmpty()) normTargetClasses.add(c);
                      }
                  }

                  if ("chat".equals(type)) {
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!isStaff) return normMyClass.equals(normTargetClass);
                          return normMyClass.equals(normTargetClass) || normAssigned.contains(normTargetClass);
                      }
                      return false;
                  }

                  if (!isStaff) {
                      String targetStudentId = n.optString("targetStudentId", "");
                      if (!targetStudentId.isEmpty() && !targetStudentId.equals(myActorId)) return false;
                      if ("attendance".equals(type) || "leave".equals(type)) {
                          return !targetStudentId.isEmpty() && targetStudentId.equals(myActorId);
                      }
                      if (!normTargetClasses.isEmpty() && !normTargetClasses.contains("ALL")) {
                          if (!normMyClass.isEmpty() && !normTargetClasses.contains(normMyClass)) return false;
                      }
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!normMyClass.isEmpty() && !normMyClass.equals(normTargetClass)) return false;
                      }
                      return true;
                  }

                  if (!isPrincipal) {
                      if (!normTargetClasses.isEmpty() && !normTargetClasses.contains("ALL")) {
                          boolean matchAny = (!normMyClass.isEmpty() && normTargetClasses.contains(normMyClass));
                          if (!matchAny) {
                              for (String a : normAssigned) {
                                  if (normTargetClasses.contains(a)) { matchAny = true; break; }
                              }
                          }
                          if (!matchAny) return false;
                      }
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!normMyClass.equals(normTargetClass) && !normAssigned.contains(normTargetClass)) return false;
                      }
                  }
                  return true;
              }

