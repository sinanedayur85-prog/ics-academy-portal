              private static String sanitizeActorTopic(String actorId) {
                  if (actorId == null) return "";
                  String clean = actorId.trim().replaceAll("[^a-zA-Z0-9_-]", "_");
                  if (clean.length() > 64) clean = clean.substring(0, 64);
                  return clean.isEmpty() ? "" : ("ics_actor_" + clean);
