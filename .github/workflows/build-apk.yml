                          appendValues.put(actorStrVal);
                          JSONObject appendObj = new JSONObject();
                          appendObj.put("values", appendValues);

                          JSONObject transform = new JSONObject();
                          transform.put("fieldPath", "deliveredTo");
                          transform.put("appendMissingElements", appendObj);
                          JSONArray transforms = new JSONArray();
                          transforms.put(transform);

                          JSONObject precondition = new JSONObject();
                          precondition.put("exists", true);

                          JSONObject write = new JSONObject();
                          write.put("update", updateDoc);
                          write.put("updateMask", updateMask);
                          write.put("updateTransforms", transforms);
                          write.put("currentDocument", precondition);

                          JSONArray writes = new JSONArray();
                          writes.put(write);

                          JSONObject root = new JSONObject();
                          root.put("writes", writes);

                          byte[] payloadBytes = root.toString().getBytes(StandardCharsets.UTF_8);

                          URL url = new URL(commitUrl);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(4500);
                          conn.setReadTimeout(4500);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payloadBytes);
                              os.flush();
                          }
                          int code = conn.getResponseCode();
                          if (code >= 200 && code < 300) {
                              return;
                          }
                          if (attempt == 0 && (code == 403 || code == 404 || code >= 500)) {
                              try {
                                  Thread.sleep(1200L);
                              } catch (InterruptedException ignored) {
                              }
                          } else {
                              return;
                          }
                      } catch (Exception ignored) {
                          if (attempt == 0) {
                              try {
                                  Thread.sleep(1000L);
                              } catch (InterruptedException ignored2) {
                              }
                          }
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }
              }

              private void ensureCallChannel(NotificationManager manager) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CALL_CHANNEL_ID,
                          "ICS Academy Incoming Calls",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Full-screen phone alerts for incoming voice and video calls");
                      channel.enableVibration(true);
                      channel.setVibrationPattern(new long[]{0L, 650L, 450L, 650L, 1200L});
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      if (ringtoneUri != null) {
                          AudioAttributes attrs = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build();
                          channel.setSound(ringtoneUri, attrs);
                      }
                      manager.createNotificationChannel(channel);
                  }
              }

              private void showFullScreenIncomingCall(Map<String, String> data, String fallbackTitle) {
                  String callId = data.get("callId");
                  if (callId == null) callId = "";
                  callId = callId.trim();
                  String callType = "video".equalsIgnoreCase(data.get("callType")) ? "video" : "voice";
                  String callerName = data.get("callerName");
                  if (callerName == null || callerName.trim().isEmpty()) {
                      callerName = (fallbackTitle != null && !fallbackTitle.trim().isEmpty()) ? fallbackTitle.trim() : "ICS Academy";
                  } else {
                      callerName = callerName.trim();
                  }
                  String callerSubtitle = data.get("callerSubtitle");
                  callerSubtitle = callerSubtitle != null ? callerSubtitle.trim() : "";
                  String roomId = data.get("roomId");
                  roomId = roomId != null ? roomId.trim() : "";

                  int callNotifyId = computeCallNotifyId(callId);
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager == null) return;
                  ensureCallChannel(manager);

                  int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                      ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                      : PendingIntent.FLAG_UPDATE_CURRENT;

                  Intent fullScreenIntent = new Intent(this, IncomingCallActivity.class);
                  fullScreenIntent.setFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK
                          | Intent.FLAG_ACTIVITY_NO_USER_ACTION
                          | Intent.FLAG_ACTIVITY_SINGLE_TOP
                  );
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_CALL_ID, callId);
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_CALL_TYPE, callType);
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_CALLER_NAME, callerName);
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_CALLER_SUBTITLE, callerSubtitle);
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_ROOM_ID, roomId);
                  fullScreenIntent.putExtra(IncomingCallActivity.EXTRA_NOTIFY_ID, callNotifyId);
                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(this, callNotifyId, fullScreenIntent, flags);

                  String acceptHref = "#campus-chat";
                  try {
                      StringBuilder sb = new StringBuilder("#campus-chat?");
                      boolean hasParam = false;
                      if (!roomId.isEmpty()) {
                          sb.append("room=").append(URLEncoder.encode(roomId, "UTF-8"));
                          hasParam = true;
                      }
                      if (!callId.isEmpty()) {
                          if (hasParam) sb.append("&");
                          sb.append("callId=").append(URLEncoder.encode(callId, "UTF-8"));
                          hasParam = true;
                      }
                      if (hasParam) sb.append("&");
                      sb.append("callAction=accept");
                      acceptHref = sb.toString();
                  } catch (Exception ignored) {
                  }

                  Intent acceptIntent = new Intent(this, MainActivity.class);
                  acceptIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  acceptIntent.putExtra(MainActivity.EXTRA_TARGET_HREF, acceptHref);
                  acceptIntent.putExtra(IncomingCallActivity.EXTRA_CALL_ID, callId);
                  acceptIntent.putExtra(IncomingCallActivity.EXTRA_NOTIFY_ID, callNotifyId);
                  PendingIntent acceptPendingIntent = PendingIntent.getActivity(this, callNotifyId + 1, acceptIntent, flags);

                  Intent declineIntent = new Intent(this, CampusCallActionReceiver.class);
                  declineIntent.setAction(CampusCallActionReceiver.ACTION_DECLINE_CALL);
                  declineIntent.putExtra(IncomingCallActivity.EXTRA_CALL_ID, callId);
                  declineIntent.putExtra(IncomingCallActivity.EXTRA_NOTIFY_ID, callNotifyId);
                  PendingIntent declinePendingIntent = PendingIntent.getBroadcast(this, callNotifyId + 2, declineIntent, flags);

                  String callDesc = "video".equals(callType)
                      ? "Incoming Video Call • ICS Academy"
                      : "Incoming Voice Call • ICS Academy";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_stat_ics)
                      .setColor(Color.parseColor("#009245"))
                      .setContentTitle(callerName)
                      .setContentText(callDesc)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setAutoCancel(true)
                      .setTimeoutAfter(45000L)
                      .setContentIntent(fullScreenPendingIntent)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .addAction(R.drawable.ic_call_decline, "Decline", declinePendingIntent)
                      .addAction(R.drawable.ic_call_accept, "Accept", acceptPendingIntent);

                  Notification built = builder.build();
                  built.flags |= Notification.FLAG_INSISTENT;
                  manager.notify(callNotifyId, built);

                  try {
                      startActivity(fullScreenIntent);
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onNewToken(@NonNull String token) {
                  super.onNewToken(token);
                  try {
                      SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      prefs.edit().putString("fcmToken", token.trim()).apply();
                      syncTopicsForIdentity(this);
                      registerTokenToServerAsync(this, token.trim());
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  try {
                      Map<String, String> data = remoteMessage.getData();
                      String title = data.get("title");
                      String body = data.get("body");
                      String notifId = data.get("notificationId");
                      String type = data.get("type");
                      String senderId = data.get("senderId");
                      String messageId = data.get("messageId");
                      String callAction = data.get("callAction");
                      String callId = data.get("callId");

                      SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      String myActorId = prefs.getString("actorId", "");
                      if (myActorId != null) myActorId = myActorId.trim();
                      if (senderId != null) senderId = senderId.trim();

                      // Never notify or self-ack our own messages
                      if (senderId != null && !senderId.isEmpty() && senderId.equals(myActorId)) {
                          return;
                      }

                      // Handle remote caller cancellation -> stop ringing & dismiss full-screen UI immediately
                      if ("call_cancel".equals(type) || "cancel".equals(callAction)) {
                          int callNotifyId = computeCallNotifyId(callId);
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              nm.cancel(callNotifyId);
                          }
                          Intent cancelBroadcast = new Intent(IncomingCallActivity.ACTION_CALL_CANCELLED);
                          cancelBroadcast.setPackage(getPackageName());
                          if (callId != null) {
                              cancelBroadcast.putExtra(IncomingCallActivity.EXTRA_CALL_ID, callId.trim());
                          }
                          sendBroadcast(cancelBroadcast);
                          return;
                      }

                      // Handle incoming phone-style Voice/Video call when app is closed or backgrounded
                      if ("call".equals(type)) {
                          if (!MainActivity.isActivityInForeground()) {
                              showFullScreenIncomingCall(data, title);
                          }
                          return;
                      }

                      if ((title == null || title.trim().isEmpty()) && remoteMessage.getNotification() != null) {
                          title = remoteMessage.getNotification().getTitle();
                      }
                      if ((body == null || body.trim().isEmpty()) && remoteMessage.getNotification() != null) {
                          body = remoteMessage.getNotification().getBody();
                      }
                      if (title == null || title.trim().isEmpty()) {
                          title = "ICS Academy";
                      }
                      if (body == null) {
                          body = "";
                      }

                      if (notifId != null && !notifId.trim().isEmpty()) {
                          Set<String> seen = new HashSet<String>(prefs.getStringSet("seenNotifIds", new HashSet<String>()));
                          seen.add(notifId.trim());
                          prefs.edit().putStringSet("seenNotifIds", seen).apply();
                      }

                      String rawHref = data.get("href");
                      String safeHref = MainActivity.sanitizeTargetHref(rawHref);
                      if (safeHref.isEmpty()) {
                          if ("chat".equals(type)) safeHref = "#campus-chat";
                          else if ("attendance".equals(type)) safeHref = "#attendance";
                          else if ("leave".equals(type)) safeHref = "#leave";
                          else if ("exam".equals(type) || "marks".equals(type)) safeHref = "#academic-hub";
                          else safeHref = "#notices";
                      }

                      // 1. Display the crisp white-icon Android system notification IMMEDIATELY when app is closed/background
                      if (!MainActivity.isActivityInForeground()) {
                          NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (manager != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  NotificationChannel channel = new NotificationChannel(
                                      CHANNEL_ID,
                                      "ICS Academy Announcements & Attendance",
                                      NotificationManager.IMPORTANCE_HIGH
                                  );
                                  channel.enableVibration(true);
                                  manager.createNotificationChannel(channel);
                              }

                              int notifyId = (notifId != null && !notifId.isEmpty())
                                  ? Math.abs(notifId.hashCode())
                                  : (int) (System.currentTimeMillis() & 0x7fffffff);

                              Intent intent = new Intent(this, MainActivity.class);
                              intent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              intent.putExtra(MainActivity.EXTRA_TARGET_HREF, safeHref);
                              int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                                  ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                                  : PendingIntent.FLAG_UPDATE_CURRENT;
                              PendingIntent pendingIntent = PendingIntent.getActivity(this, notifyId, intent, flags);

                              NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                                  .setSmallIcon(R.drawable.ic_stat_ics)
                                  .setColor(Color.parseColor("#009245"))
                                  .setContentTitle(title.trim())
                                  .setContentText(body.trim())
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body.trim()))
                                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                                  .setDefaults(NotificationCompat.DEFAULT_ALL)
                                  .setAutoCancel(true)
                                  .setContentIntent(pendingIntent);

                              manager.notify(notifyId, builder.build());
                          }
                      }

                      // 2. Real WhatsApp-style 2-tick delivery ACK: ONLY fires because this device's internet is ON
                      //    and FCM actually delivered this chat message to the device!
                      String resolvedMsgId = (messageId != null && !messageId.trim().isEmpty())
                          ? messageId.trim()
                          : (notifId != null && notifId.startsWith("notif_chat_")
                              ? notifId.substring("notif_chat_".length()).trim()
                              : "");

                      if ("chat".equals(type)
                          && !resolvedMsgId.isEmpty()
                          && myActorId != null
                          && !myActorId.isEmpty()
                          && !myActorId.equals(senderId)) {
                          acknowledgeChatDeliverySync(resolvedMsgId, myActorId);
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          `;
          fs.writeFileSync(fcmServicePath, fcmServiceJava, 'utf8');

          console.log('Successfully configured Android MainActivity, IncomingCallActivity, CallActionReceiver, FCM Messaging Service, Background Notification Service, styles.xml, and persistent signing key');
          EOF
          node configure-android.cjs
          rm configure-android.cjs

