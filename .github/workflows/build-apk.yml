                  @JavascriptInterface
                  public void showNotificationWithHref(final String title, final String message, final String href) {
                      runOnUiThread(() -> {
                          try {
                              String safeTitle = (title != null && !title.trim().isEmpty()) ? title.trim() : "ICS Academy";
                              String safeMessage = (message != null) ? message.trim() : "";
                              String safeHref = sanitizeTargetHref(href);
                              if (safeHref.isEmpty()) safeHref = "#notices";
                              String combinedLine = safeMessage.isEmpty() ? safeTitle : (safeTitle + ": " + safeMessage);

                              int totalCount;
                              ArrayList<String> snapshotLines;
                              synchronized (groupedNotificationLines) {
                                  groupedNotificationLines.add(combinedLine);
                                  while (groupedNotificationLines.size() > 10) {
                                      groupedNotificationLines.remove(0);
                                  }
                                  totalCount = groupedNotificationLines.size();
                                  snapshotLines = new ArrayList<>(groupedNotificationLines);
                              }

                              Intent intent = new Intent(MainActivity.this, MainActivity.class);
                              intent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              intent.putExtra(EXTRA_TARGET_HREF, safeHref);
                              int flags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                                  ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                                  : PendingIntent.FLAG_UPDATE_CURRENT;
                              PendingIntent pendingIntent = PendingIntent.getActivity(MainActivity.this, GROUPED_NOTIFICATION_ID, intent, flags);

                              String headerTitle = totalCount == 1
                                  ? safeTitle
                                  : ("ICS Academy • " + totalCount + " New Messages");
                              String contentPreview = totalCount == 1
                                  ? safeMessage
                                  : combinedLine;

                              NotificationCompat.InboxStyle inboxStyle = new NotificationCompat.InboxStyle()
                                  .setBigContentTitle(headerTitle);
                              for (String line : snapshotLines) {
                                  inboxStyle.addLine(line);
                              }
                              if (totalCount > 1) {
                                  inboxStyle.setSummaryText(totalCount + " updates");
                              }

                              NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, CHANNEL_ID)
                                  .setSmallIcon(R.drawable.ic_stat_ics)
                                  .setColor(Color.parseColor("#009245"))
                                  .setContentTitle(headerTitle)
                                  .setContentText(contentPreview)
                                  .setStyle(inboxStyle)
                                  .setNumber(totalCount)
                                  .setOnlyAlertOnce(true)
                                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                                  .setAutoCancel(true)
                                  .setContentIntent(pendingIntent);

                              NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                              if (manager != null) {
                                  manager.notify(GROUPED_NOTIFICATION_ID, builder.build());
                              }
                          } catch (Exception ignored) {
                          }
                      });
                  }

