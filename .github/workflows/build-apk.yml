                      NotificationCompat.InboxStyle inbox = new NotificationCompat.InboxStyle().setBigContentTitle(headerTitle);
                      int start = Math.max(0, count - 8);
                      for (int i = start; i < count; i++) {
                          String line = messages.get(i).isEmpty() ? titles.get(i) : (titles.get(i) + ": " + messages.get(i));
                          inbox.addLine(line);
                      }

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_stat_ics)
                          .setColor(Color.parseColor("#009245"))
                          .setContentTitle(headerTitle)
                          .setContentText(preview)
                          .setStyle(inbox)
                          .setNumber(count)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                      manager.notify(BG_NOTIFICATION_ID, builder.build());
                  } catch (Exception ignored) {
                  }
              }
