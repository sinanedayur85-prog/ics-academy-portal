name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ICS-Academy-Manhappatta APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository & configure Node/Java 21
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git fetch --depth=1 origin "${COMMIT_SHA}"
          git checkout --force FETCH_HEAD

          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "${JAVA_HOME_21_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          elif [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64" >> "$GITHUB_ENV"
            echo "/usr/lib/jvm/temurin-21-jdk-amd64/bin" >> "$GITHUB_PATH"
          fi

      - name: Prepare package.json & version.json for CI
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.devDependencies) {
              delete pkg.devDependencies["@firebase/eslint-plugin-security-rules"];
              delete pkg.devDependencies["esbuild"];
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

            const runNum = Number(process.env.RUN_NUMBER || 1);
            const sha = (process.env.COMMIT_SHA || "ci").slice(0, 7);
            const versionInfo = {
              version: "1.0." + runNum,
              buildNumber: runNum,
              commitSha: sha,
              builtAt: new Date().toISOString()
            };
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/version.json", JSON.stringify(versionInfo, null, 2));
          '

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android packages
        run: npm install --legacy-peer-deps @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2

      - name: Build Web Application
        run: |
          rm -rf public/assets/aistudio
          npm run build

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Persistent Signing Key, Edge-to-Edge Status Bar & Native PDF/Print/OTA Bridge
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat << 'EOF' > configure-android.cjs
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          // 0. Install consistent debug.keystore so future APKs update seamlessly in-place without uninstalling
          const FIXED_KEYSTORE_BASE64 = '';
          const keystoreBuf = Buffer.from(FIXED_KEYSTORE_BASE64, 'base64');
          const dotAndroidDir = path.join(os.homedir(), '.android');
          fs.mkdirSync(dotAndroidDir, { recursive: true });
          fs.writeFileSync(path.join(dotAndroidDir, 'debug.keystore'), keystoreBuf);
          if (fs.existsSync('android/app')) {
            fs.writeFileSync('android/app/debug.keystore', keystoreBuf);
          }

          // Update versionCode and versionName in android/app/build.gradle + bundle Firebase Cloud Messaging (FCM)
          const runNum = Number(process.env.RUN_NUMBER || 1);
          const googleServicesSrc = 'android-config/google-services.json';
          const googleServicesDest = 'android/app/google-services.json';
          if (fs.existsSync(googleServicesSrc) && fs.existsSync('android/app')) {
            fs.copyFileSync(googleServicesSrc, googleServicesDest);
            console.log('Bundled android/app/google-services.json for instant FCM push notifications');
          }

          const rootGradlePath = 'android/build.gradle';
          if (fs.existsSync(rootGradlePath)) {
            let rootGradle = fs.readFileSync(rootGradlePath, 'utf8');
            if (!rootGradle.includes('com.google.gms:google-services')) {
              rootGradle = rootGradle.replace(
                /(classpath\s+['"]com\.android\.tools\.build:gradle:[^'"]+['"])/,
                "$1\n        classpath 'com.google.gms:google-services:4.4.2'"
              );
              fs.writeFileSync(rootGradlePath, rootGradle, 'utf8');
            }
          }

          const buildGradlePath = 'android/app/build.gradle';
          if (fs.existsSync(buildGradlePath)) {
            let gradleContent = fs.readFileSync(buildGradlePath, 'utf8');
            gradleContent = gradleContent.replace(/versionCode\s+\d+/, 'versionCode ' + (100 + runNum));
            gradleContent = gradleContent.replace(/versionName\s+"[^"]*"/, 'versionName "1.0.' + runNum + '"');
            if (!gradleContent.includes('com.google.firebase:firebase-messaging')) {
              gradleContent = gradleContent.replace(
                /^dependencies\s*\{/m,
                "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'"
              );
            }
            if (!gradleContent.includes('com.google.gms.google-services') && fs.existsSync(googleServicesDest)) {
              gradleContent += "\napply plugin: 'com.google.gms.google-services'\n";
            }
            fs.writeFileSync(buildGradlePath, gradleContent, 'utf8');
          }

          // 1. Set Android app display name to "ICS Academy" in strings.xml
          const stringsPath = 'android/app/src/main/res/values/strings.xml';
          if (fs.existsSync(stringsPath)) {
            const stringsXml = `<?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">ICS Academy</string>
              <string name="title_activity_main">ICS Academy</string>
              <string name="package_name">com.icsacademy.manhappatta</string>
              <string name="custom_url_scheme">com.icsacademy.manhappatta</string>
          </resources>`;
            fs.writeFileSync(stringsPath, stringsXml, 'utf8');
          }

          // 1b. Replace Capacitor default icons with Official ICS Academy Launcher Icons & Branded Launch Splash
          const resDir = 'android/app/src/main/res';
          if (fs.existsSync(resDir)) {
            // Remove any default Capacitor vector drawables that override mipmap PNGs
            const vectorDrawablesToRemove = [
              path.join(resDir, 'drawable', 'ic_launcher_foreground.xml'),
              path.join(resDir, 'drawable-v24', 'ic_launcher_foreground.xml'),
              path.join(resDir, 'drawable', 'ic_launcher_background.xml'),
            ];
            for (const vecPath of vectorDrawablesToRemove) {
              if (fs.existsSync(vecPath)) {
                fs.unlinkSync(vecPath);
              }
            }

            // Set adaptive icon background color to #FFFFFF (pure white like YT Create & YT Studio)
            const valuesDir = path.join(resDir, 'values');
            fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(
              path.join(valuesDir, 'ic_launcher_background.xml'),
              `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n`,
              'utf8'
            );

            // Configure adaptive icon XMLs in mipmap-anydpi-v26
            const anydpiDir = path.join(resDir, 'mipmap-anydpi-v26');
            fs.mkdirSync(anydpiDir, { recursive: true });
            const adaptiveIconXml = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>`;
            fs.writeFileSync(path.join(anydpiDir, 'ic_launcher.xml'), adaptiveIconXml, 'utf8');
            fs.writeFileSync(path.join(anydpiDir, 'ic_launcher_round.xml'), adaptiveIconXml, 'utf8');

            // Copy official ICS Academy PNG icons (with pure white background) into all mipmap-* directories
            const squareIconBuf = fs.readFileSync('public/icons/icon-512.png');
            const roundIconBuf = fs.readFileSync('public/icons/ic_launcher_round.png');
            const fgIconBuf = fs.readFileSync('public/icons/ic_launcher_foreground.png');

            const mipmapDirs = ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi'];
            for (const dirName of mipmapDirs) {
              const targetDir = path.join(resDir, dirName);
              fs.mkdirSync(targetDir, { recursive: true });
              fs.writeFileSync(path.join(targetDir, 'ic_launcher.png'), squareIconBuf);
              fs.writeFileSync(path.join(targetDir, 'ic_launcher_round.png'), roundIconBuf);
              fs.writeFileSync(path.join(targetDir, 'ic_launcher_foreground.png'), fgIconBuf);
            }

            // Remove any default Capacitor splash.png files so Android only uses launch_splash.xml (#0A0B0E black)
            const resEntries = fs.readdirSync(resDir, { withFileTypes: true });
            for (const entry of resEntries) {
              if (entry.isDirectory() && entry.name.startsWith('drawable')) {
                const splashFile = path.join(resDir, entry.name, 'splash.png');
                if (fs.existsSync(splashFile)) {
                  fs.unlinkSync(splashFile);
                }
              }
            }

            const drawableDir = path.join(resDir, 'drawable');
            fs.mkdirSync(drawableDir, { recursive: true });
            fs.writeFileSync(path.join(drawableDir, 'ics_splash_logo.png'), fgIconBuf);
            const launchSplashXml = `<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#0A0B0E" />
              </item>
              <item
                  android:width="160dp"
                  android:height="160dp"
                  android:drawable="@drawable/ics_splash_logo"
                  android:gravity="center" />
          </layer-list>`;
            fs.writeFileSync(path.join(drawableDir, 'launch_splash.xml'), launchSplashXml, 'utf8');
          }

          // 1c. Update styles.xml and values-v31/styles.xml for pure #0A0B0E black launch splash on all Android versions
          const stylesPath = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(stylesPath)) {
            const stylesXml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">#0A0B0E</item>
                  <item name="colorPrimaryDark">#0A0B0E</item>
                  <item name="colorAccent">#8CC63F</item>
                  <item name="android:windowBackground">#0A0B0E</item>
                  <item name="android:colorBackground">#0A0B0E</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#0A0B0E</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowTranslucentStatus">false</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="android:windowBackground">#0A0B0E</item>
                  <item name="android:colorBackground">#0A0B0E</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#0A0B0E</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/launch_splash</item>
                  <item name="android:windowBackground">@drawable/launch_splash</item>
              </style>
          </resources>`;
            fs.writeFileSync(stylesPath, stylesXml, 'utf8');

            const v31Dir = 'android/app/src/main/res/values-v31';
            fs.mkdirSync(v31Dir, { recursive: true });
            const v31StylesXml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_splash</item>
                  <item name="android:windowSplashScreenBackground">#0A0B0E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/ics_splash_logo</item>
              </style>
          </resources>`;
            fs.writeFileSync(path.join(v31Dir, 'styles.xml'), v31StylesXml, 'utf8');
          }

          // 2. Ensure AndroidManifest.xml has notification, boot-completed, microphone, camera & legacy storage permissions + background notification JobService
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            if (!manifest.includes('POST_NOTIFICATIONS')) {
              manifest = manifest.replace(
                '<uses-permission android:name="android.permission.INTERNET" />',
                '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
              );
            } else if (!manifest.includes('RECEIVE_BOOT_COMPLETED')) {
              manifest = manifest.replace(
                '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
              );
            }
            if (!manifest.includes('CampusBackgroundNotificationService')) {
              manifest = manifest.replace(
                '</application>',
                '    <service\n            android:name=".CampusFirebaseMessagingService"\n            android:exported="false">\n            <intent-filter>\n                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n            </intent-filter>\n        </service>\n        <meta-data\n            android:name="com.google.firebase.messaging.default_notification_channel_id"\n            android:value="ics_academy_updates" />\n        <service\n            android:name=".CampusBackgroundNotificationService"\n            android:permission="android.permission.BIND_JOB_SERVICE"\n            android:exported="false" />\n        <receiver\n            android:name=".CampusBootReceiver"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n            </intent-filter>\n        </receiver>\n    </application>'
              );
            }
            fs.writeFileSync(manifestPath, manifest, 'utf8');
          }

          // 3. Write MainActivity.java with Edge-to-Edge Status Bar + Native Notifications + PDF/Print + Safe Browser APK Updater Bridge
          const mainActivityDir = 'android/app/src/main/java/com/icsacademy/manhappatta';
          fs.mkdirSync(mainActivityDir, { recursive: true });
          const mainActivityPath = path.join(mainActivityDir, 'MainActivity.java');

          const mainActivityJava = `package com.icsacademy.manhappatta;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.print.PageRange;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintDocumentInfo;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.speech.RecognizerIntent;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private static final String CHANNEL_ID = "ics_academy_updates";
              private static final int GROUPED_NOTIFICATION_ID = 1001;
              private static final int REQ_VOICE_RECOGNITION = 2002;
              private static volatile boolean activityInForeground = false;
              private int lastStatusBarHeightDp = 28;
              private final ArrayList<String> groupedNotificationLines = new ArrayList<>();

              public static boolean isActivityInForeground() {
                  return activityInForeground;
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createNotificationChannel();
                  requestAppPermissionsIfNeeded();
                  clearGroupedSystemNotifications();
                  CampusFirebaseMessagingService.syncCurrentTokenToServer(this);
                  CampusBackgroundNotificationService.schedulePeriodic(this);

                  Window window = getWindow();
                  window.getDecorView().setBackgroundColor(Color.parseColor("#0A0B0E"));
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.parseColor("#0A0B0E"));

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      window.setAttributes(lp);
                  }

                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, window.getDecorView());
                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      webView.setBackgroundColor(Color.parseColor("#0A0B0E"));
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new ICSNativeBridge(), "ICSNativeBridge");

                      // Ensure WebView grants getUserMedia microphone and camera requests when app permission is granted
                      webView.setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> {
                                  try {
                                      ArrayList<String> missingPerms = new ArrayList<>();
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO)
                                          != PackageManager.PERMISSION_GRANTED) {
                                          missingPerms.add(Manifest.permission.RECORD_AUDIO);
                                      }
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)
                                          != PackageManager.PERMISSION_GRANTED) {
                                          missingPerms.add(Manifest.permission.CAMERA);
                                      }
                                      if (!missingPerms.isEmpty()) {
                                          ActivityCompat.requestPermissions(
                                              MainActivity.this,
                                              missingPerms.toArray(new String[0]),
                                              1002
                                          );
                                      }
                                      request.grant(request.getResources());
                                  } catch (Exception e) {
                                      super.onPermissionRequest(request);
                                  }
                              });
                          }
                      });

                      ViewCompat.setOnApplyWindowInsetsListener(webView, (v, windowInsets) -> {
                          Insets insets = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                          float density = getResources().getDisplayMetrics().density;
                          int topDp = Math.max(24, Math.round(insets.top / (density > 0 ? density : 1f)));
                          lastStatusBarHeightDp = topDp;
                          injectStatusBarHeight(webView, topDp);
                          return WindowInsetsCompat.CONSUMED;
                      });

                      webView.postDelayed(() -> injectStatusBarHeight(webView, lastStatusBarHeightDp), 300);
                      webView.postDelayed(() -> injectStatusBarHeight(webView, lastStatusBarHeightDp), 1200);
                      webView.postDelayed(() -> injectStatusBarHeight(webView, lastStatusBarHeightDp), 2500);
                      webView.postDelayed(() -> injectStatusBarHeight(webView, lastStatusBarHeightDp), 4500);
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "ICS Academy Announcements & Attendance",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Notifications for Usthad announcements, holidays, and attendance updates");
                      channel.enableVibration(true);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private void requestAppPermissionsIfNeeded() {
                  ArrayList<String> permsToRequest = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                          permsToRequest.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      permsToRequest.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED) {
                      permsToRequest.add(Manifest.permission.CAMERA);
                  }
                  if (!permsToRequest.isEmpty()) {
                      ActivityCompat.requestPermissions(
                          this,
                          permsToRequest.toArray(new String[0]),
                          1001
                      );
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_VOICE_RECOGNITION && this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      String spokenText = "";
                      if (resultCode == RESULT_OK && data != null) {
                          ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                          if (matches != null && !matches.isEmpty() && matches.get(0) != null) {
                              spokenText = matches.get(0);
                          }
                      }
                      final String escaped = spokenText
                          .replace("\\\\", "\\\\\\\\")
                          .replace("'", "\\\\'")
                          .replace("\\n", " ");
                      final String js = "window.dispatchEvent(new CustomEvent('ics-native-voice-result',{detail:{text:'" + escaped + "'}}));";
                      webView.post(() -> webView.evaluateJavascript(js, null));
                  }
              }

              private void injectStatusBarHeight(final WebView webView, final int topDp) {
                  if (webView == null) return;
                  final String js = "try{document.documentElement.style.setProperty('--android-status-bar-height','" + topDp + "px');}catch(e){}";
                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              @Override
              public void onResume() {
                  super.onResume();
                  activityInForeground = true;
                  clearGroupedSystemNotifications();
              }

              @Override
              public void onPause() {
                  activityInForeground = false;
                  super.onPause();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  clearGroupedSystemNotifications();
              }

              @Override
              public void onStop() {
                  activityInForeground = false;
                  super.onStop();
                  try {
                      android.content.SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                      prefs.edit().putLong("lastActiveMs", System.currentTimeMillis()).apply();
                  } catch (Exception ignored) {
                  }
                  CampusBackgroundNotificationService.schedulePeriodic(this);
