              private String normalizeClass(String raw) {
                  if (raw == null) return "";
                  return raw.replaceFirst("(?i)^class\\\\s+", "").replaceAll("\\\\s+", " ").trim().toUpperCase(Locale.ROOT);
              }

              private String httpGet(String urlStr) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(6000);
                      conn.setReadTimeout(6000);
                      conn.setUseCaches(false);
                      int code = conn.getResponseCode();
                      if (code < 200 || code >= 300) return null;
                      StringBuilder sb = new StringBuilder();
                      try (BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"))) {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              sb.append(line);
                          }
                      }
                      return sb.toString();
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private void checkAndNotify() {
                  SharedPreferences prefs = getSharedPreferences("ics_notif_prefs", Context.MODE_PRIVATE);
                  String actorId = prefs.getString("actorId", "");
                  if (actorId == null || actorId.trim().isEmpty()) return;

                  String actorName = prefs.getString("actorName", "");
                  String role = prefs.getString("role", "student");
                  String className = prefs.getString("className", "");
                  String assignedJson = prefs.getString("assignedClassesJson", "[]");
                  boolean isPrincipal = "principal".equalsIgnoreCase(role);
                  boolean isStaff = isPrincipal || "usthad".equalsIgnoreCase(role);

                  ArrayList<String> assignedClasses = new ArrayList<>();
                  try {
                      JSONArray arr = new JSONArray(assignedJson);
                      for (int i = 0; i < arr.length(); i++) {
                          String norm = normalizeClass(arr.optString(i, ""));
                          if (!norm.isEmpty()) assignedClasses.add(norm);
                      }
                  } catch (Exception ignored) {
                  }
                  String normMyClass = normalizeClass(className);

                  String body = null;
                  for (String base : API_BASES) {
                      try {
                          String q = base + "/api/campus/state?actorId=" + URLEncoder.encode(actorId, "UTF-8")
                              + "&className=" + URLEncoder.encode(className, "UTF-8")
                              + "&isStaff=" + (isStaff ? "true" : "false");
                          body = httpGet(q);
                          if (body != null && body.startsWith("{")) break;
                      } catch (Exception ignored) {
                      }
                  }
                  if (body == null) return;

                  Set<String> seen = new HashSet<String>(prefs.getStringSet("seenNotifIds", new HashSet<String>()));
                  boolean seenChanged = false;
                  long nowMs = System.currentTimeMillis();
                  long lastActiveMs = prefs.getLong("lastActiveMs", 0L);
                  long cutoffMs = lastActiveMs > 0L ? Math.max(nowMs - (12L * 60L * 60L * 1000L), lastActiveMs - 30_000L) : (nowMs - (12L * 60L * 60L * 1000L));
                  ArrayList<String> newTitles = new ArrayList<>();
                  ArrayList<String> newMessages = new ArrayList<>();

                  try {
                      JSONObject root = new JSONObject(body);
                      JSONArray notifs = root.optJSONArray("notifications");
                      if (notifs == null) return;

                      for (int i = notifs.length() - 1; i >= 0; i--) {
                          JSONObject n = notifs.optJSONObject(i);
                          if (n == null) continue;
                          String id = n.optString("id", "");
                          if (id.isEmpty() || seen.contains(id)) continue;

                          long createdAtMs = n.optLong("createdAtMs", nowMs);
                          if (createdAtMs < cutoffMs) {
                              seen.add(id);
                              seenChanged = true;
                              continue;
                          }

                          if (isTargeted(n, actorId, actorName, isStaff, isPrincipal, normMyClass, assignedClasses)) {
                              seen.add(id);
                              seenChanged = true;
                              String t = n.optString("title", "ICS Academy");
                              String m = n.optString("message", "");
                              newTitles.add(t);
                              newMessages.add(m);
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  if (seenChanged) {
                      // Cap stored seen IDs to last 150
                      if (seen.size() > 150) {
                          ArrayList<String> trimmed = new ArrayList<>(seen);
                          seen = new HashSet<>(trimmed.subList(trimmed.size() - 120, trimmed.size()));
                      }
                      prefs.edit().putStringSet("seenNotifIds", seen).apply();
                  }

                  if (!newTitles.isEmpty()) {
                      postNativeBackgroundNotification(newTitles, newMessages);
                  }
              }

              private boolean isTargeted(
                  JSONObject n,
                  String myActorId,
                  String myActorName,
                  boolean isStaff,
                  boolean isPrincipal,
                  String normMyClass,
                  ArrayList<String> normAssigned
              ) {
                  String senderId = n.optString("actorId", "");
                  String senderName = n.optString("actorName", "");
                  if (!senderId.isEmpty() && senderId.equals(myActorId)) return false;
                  if (senderId.isEmpty() && !senderName.isEmpty() && !myActorName.isEmpty()
                      && senderName.trim().equalsIgnoreCase(myActorName.trim())) return false;

                  String targetRecipientId = n.optString("targetRecipientId", "");
                  if (!targetRecipientId.isEmpty()) return targetRecipientId.equals(myActorId);

                  if (n.optBoolean("targetStaffOnly", false)) return isStaff;

                  String type = n.optString("type", "notice");
                  String normTargetClass = normalizeClass(n.optString("targetClass", ""));
                  ArrayList<String> normTargetClasses = new ArrayList<>();
                  JSONArray tcArr = n.optJSONArray("targetClasses");
                  if (tcArr != null) {
                      for (int i = 0; i < tcArr.length(); i++) {
                          String c = normalizeClass(tcArr.optString(i, ""));
                          if (!c.isEmpty()) normTargetClasses.add(c);
                      }
                  }

                  if ("chat".equals(type)) {
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!isStaff) return normMyClass.equals(normTargetClass);
                          return normMyClass.equals(normTargetClass) || normAssigned.contains(normTargetClass);
                      }
                      return false;
                  }

                  if (!isStaff) {
                      String targetStudentId = n.optString("targetStudentId", "");
                      if (!targetStudentId.isEmpty() && !targetStudentId.equals(myActorId)) return false;
                      if ("attendance".equals(type) || "leave".equals(type)) {
                          return !targetStudentId.isEmpty() && targetStudentId.equals(myActorId);
                      }
                      if (!normTargetClasses.isEmpty() && !normTargetClasses.contains("ALL")) {
                          if (!normMyClass.isEmpty() && !normTargetClasses.contains(normMyClass)) return false;
                      }
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!normMyClass.isEmpty() && !normMyClass.equals(normTargetClass)) return false;
                      }
                      return true;
                  }

                  if (!isPrincipal) {
                      if (!normTargetClasses.isEmpty() && !normTargetClasses.contains("ALL")) {
                          boolean matchAny = (!normMyClass.isEmpty() && normTargetClasses.contains(normMyClass));
                          if (!matchAny) {
                              for (String a : normAssigned) {
                                  if (normTargetClasses.contains(a)) { matchAny = true; break; }
                              }
                          }
                          if (!matchAny) return false;
                      }
                      if (!normTargetClass.isEmpty() && !"ALL".equals(normTargetClass)) {
                          if (!normMyClass.equals(normTargetClass) && !normAssigned.contains(normTargetClass)) return false;
                      }
                  }
                  return true;
              }

              private void postNativeBackgroundNotification(ArrayList<String> titles, ArrayList<String> messages) {
                  try {
                      NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
